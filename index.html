<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Todo List</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new todo..."
                autocomplete="off"
            >
            <button id="addBtn">Add</button>
        </div>

        <div class="task-tracker">
            <div class="tracker-item">
                <span class="tracker-label">Total:</span>
                <span id="totalCount" class="tracker-count">0</span>
            </div>
            <div class="tracker-item">
                <span class="tracker-label">Active:</span>
                <span id="activeCount" class="tracker-count">0</span>
            </div>
            <div class="tracker-item">
                <span class="tracker-label">Completed:</span>
                <span id="completedCount" class="tracker-count">0</span>
            </div>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- Todos will be added here -->
        </ul>

        <p id="emptyMessage" class="empty-message">No todos yet. Add one to get started!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
