<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <div class="header-icon" aria-hidden="true">✓</div>
                <h1>My Todos</h1>
            </div>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon">🌙</span>
            </button>
        </div>

        <div class="task-tracker">
            <div class="tracker-item tracker-total">
                <span id="totalCount" class="tracker-count">0</span>
                <span class="tracker-label">Total</span>
            </div>
            <div class="tracker-item tracker-active">
                <span id="activeCount" class="tracker-count">0</span>
                <span class="tracker-label">Active</span>
            </div>
            <div class="tracker-item tracker-completed">
                <span id="completedCount" class="tracker-count">0</span>
                <span class="tracker-label">Done</span>
            </div>
        </div>
        
        <div class="input-container">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="What needs to be done?"
                autocomplete="off"
            >
            <button id="addBtn" aria-label="Add todo">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Add
            </button>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- Todos will be added here -->
        </ul>

        <div id="emptyMessage" class="empty-message">
            <div class="empty-icon" aria-hidden="true">📋</div>
            <p>No todos yet.</p>
            <p class="empty-sub">Add one above to get started!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
